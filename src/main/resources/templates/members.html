<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: header}"></div>

<main class="container">
    <div class="action-bar">
        <h1 class="action-bar-title">Members</h1>
        <div class="action-bar-actions">
            <a href="/members/add" class="btn btn-primary">Add Member</a>
        </div>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Borrowed Books</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${members}">
                    <td th:text="${m.id}"></td>
                    <td><strong th:text="${m.fullName}"></strong></td>
                    <td th:text="${m.email}"></td>
                    <td>
                        <span class="badge badge-primary">
                            <span th:text="${m.books != null ? m.books.size() : 0}"></span> book<span th:if="${m.books != null && m.books.size() != 1}">s</span>
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/members/{id}(id=${m.id})}" class="btn btn-sm btn-info">View</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="5" class="text-center p-5">
                        <div class="empty-state">
                            <h3 class="empty-state-title">No Members Found</h3>
                            <p class="empty-state-description">No members registered. Add your first member to get started.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
