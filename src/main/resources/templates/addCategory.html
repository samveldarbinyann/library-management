<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: header}"></div>

<main class="container">
    <div class="action-bar">
        <h1 class="action-bar-title">Add New Category</h1>
        <div class="action-bar-actions">
            <a href="/categories" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <div class="card card-maxwidth">
        <form th:action="@{/categories/add}" th:object="${category}" method="post">

            <div class="form-group">
                <label for="name">Category Name</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Category name" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" class="form-textarea" placeholder="Category description" rows="4"></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Save Category</button>
                <a href="/categories" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
