<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: header}"></div>

<main class="container">
    <div class="action-bar">
        <h1 class="action-bar-title">Categories</h1>
        <div class="action-bar-actions">
            <a href="/categories/add" class="btn btn-primary">Add Category</a>
        </div>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${categories}">
                    <td th:text="${cat.id}"></td>
                    <td><strong th:text="${cat.name}"></strong></td>
                    <td th:text="${cat.description}"></td>
                    <td>
                        <a th:href="@{/categories/delete(id=${cat.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="4" class="text-center p-5">
                        <div class="empty-state">
                            <h3 class="empty-state-title">No Categories Found</h3>
                            <p class="empty-state-description">No categories created. Add your first category to organize books.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
