<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="login-wrapper">
    <div class="login-container">
        <div class="login-header">
            <h1>Library Management</h1>
            <p>Sign in to your account</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            <span>Invalid username or password</span>
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            <span>You have been logged out successfully</span>
        </div>

        <form th:action="@{/login}" method="post" class="login-form">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" class="form-control" placeholder="Enter username" required autofocus autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password" />
            </div>

            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>

        <div class="login-footer">
            <p><strong>Demo Accounts:</strong></p>
            <p>User: user / password</p>
            <p>Admin: admin / admin123</p>
        </div>
    </div>
</main>
</body>
</html>
