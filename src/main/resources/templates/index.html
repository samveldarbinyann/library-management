<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: header}"></div>

<main class="container">
    <header class="page-header">
        <h1 class="page-title">Library Management</h1>
        <p class="page-subtitle">Manage books, categories, and members</p>
    </header>

    <section class="dashboard-grid">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Books</div>
            </div>
            <div class="card-body">
                <p class="text-muted">Browse and manage your book collection</p>
                <div class="mt-2">
                    <a href="/books" class="btn btn-primary w-100">Manage Books</a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Categories</div>
            </div>
            <div class="card-body">
                <p class="text-muted">Organize books by categories</p>
                <div class="mt-2">
                    <a href="/categories" class="btn btn-primary w-100">Manage Categories</a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Members</div>
            </div>
            <div class="card-body">
                <p class="text-muted">Manage library members and their books</p>
                <div class="mt-2">
                    <a href="/members" class="btn btn-primary w-100">Manage Members</a>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
