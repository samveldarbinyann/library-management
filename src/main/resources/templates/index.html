<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: header}"></div>

<div class="container text-center">
    <h1 class="display-4">Welcome to Library System</h1>
    <p style="color: var(--text-secondary); font-size: 1.125rem; margin-bottom: 3rem;">
        Manage your books, categories, and members with ease
    </p>
    <div class="row" style="justify-content: center; gap: 2rem;">
        <div class="col-md-4">
            <div class="card p-3">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📚</div>
                <h3>Books</h3>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
                    Browse and manage your book collection
                </p>
                <a href="/books" class="btn btn-primary">Manage</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <div style="font-size: 3rem; margin-bottom: 1rem;">📁</div>
                <h3>Categories</h3>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
                    Organize books by categories
                </p>
                <a href="/categories" class="btn btn-success">Manage</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <div style="font-size: 3rem; margin-bottom: 1rem;">👥</div>
                <h3>Members</h3>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
                    Manage library members
                </p>
                <a href="/members" class="btn btn-info">Manage</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
