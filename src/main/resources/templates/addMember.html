<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Member - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: header}"></div>

<main class="container">
    <div class="action-bar">
        <h1 class="action-bar-title">Add New Member</h1>
        <div class="action-bar-actions">
            <a href="/members" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <div class="card card-maxwidth">
        <form th:action="@{/members/add}" th:object="${member}" method="post">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="+1 555-1234">
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Register Member</button>
                <a href="/members" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
