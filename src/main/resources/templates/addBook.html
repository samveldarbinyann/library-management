<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: header}"></div>

<main class="container">
    <div class="action-bar">
        <h1 class="action-bar-title">Add New Book</h1>
        <div class="action-bar-actions">
            <a href="/books" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <div class="card card-maxwidth">
        <form th:action="@{/books/add}" th:object="${book}" method="post" enctype="multipart/form-data">

            <div class="form-row">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Book title" required>
                </div>
                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" th:field="*{author}" class="form-control" placeholder="Author name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="year">Publication Year</label>
                    <input type="number" id="year" th:field="*{year}" class="form-control" placeholder="2024" min="1000" max="2100" required>
                </div>
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" th:field="*{genre}" class="form-control" placeholder="Fiction, Science...">
                </div>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" th:field="*{category}" class="form-select" required>
                    <option value="">Select Category</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Book Cover Image</label>
                <div class="file-upload">
                    <input type="file" id="pic" name="pic" accept="image/*">
                    <label for="pic" class="file-upload-label">
                        <span class="file-upload-text">Choose an image file...</span>
                    </label>
                </div>
                <p class="text-muted mt-2">JPG, PNG, GIF. Max 10MB</p>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Save Book</button>
                <a href="/books" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
