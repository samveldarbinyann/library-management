<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Book</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="container mt-5">
<div th:replace="~{fragments/navbar :: header}"></div>

<h2 style="margin-bottom: 2rem; color: var(--primary-color);">Add New Book</h2>

<form th:action="@{/books/add}" th:object="${book}" method="post" class="col-md-6" style="background: var(--bg-primary); padding: 2rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);">
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" th:field="*{title}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Author</label>
        <input type="text" th:field="*{author}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Year</label>
        <input type="number" th:field="*{year}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Genre</label>
        <input type="text" th:field="*{genre}" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Category</label>
        <select th:field="*{category}" class="form-select" required>
            <option value="">Select Category</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"></option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a href="/books" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
