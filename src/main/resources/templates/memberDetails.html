<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Details - Library Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: header}"></div>

<main class="container">
    <div class="action-bar">
        <h1 class="action-bar-title">Member Details</h1>
        <div class="action-bar-actions">
            <a href="/members" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <div class="grid grid-2">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Profile</div>
            </div>
            <div class="card-body space-y-3">
                <div class="d-flex justify-between">
                    <span class="text-secondary">Full Name:</span>
                    <strong th:text="${member.fullName}"></strong>
                </div>
                <div class="d-flex justify-between">
                    <span class="text-secondary">Email:</span>
                    <span th:text="${member.email}"></span>
                </div>
                <div class="d-flex justify-between">
                    <span class="text-secondary">Phone:</span>
                    <span th:text="${member.phone}"></span>
                </div>
                <div class="d-flex justify-between">
                    <span class="text-secondary">Registered:</span>
                    <span th:text="${member.registrationDate}"></span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Statistics</div>
            </div>
            <div class="card-body space-y-3">
                <div class="d-flex justify-between">
                    <span class="text-secondary">Books Borrowed:</span>
                    <span class="badge badge-primary" th:text="${member.books != null ? member.books.size() : 0}"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-5">
        <div class="action-bar">
            <div class="action-bar-title">Borrowed Books</div>
        </div>

        <div class="table-container">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Genre</th>
                        <th>Year</th>
                        <th>Category</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${member.books}">
                        <td th:text="${book.title}"></td>
                        <td th:text="${book.author}"></td>
                        <td th:text="${book.genre}"></td>
                        <td th:text="${book.year}"></td>
                        <td><span class="badge badge-primary" th:text="${book.category.name}"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(member.books)}">
                        <td colspan="5" class="text-center p-5">
                            <div class="empty-state">
                                <h3 class="empty-state-title">No Books</h3>
                                <p class="empty-state-description">This member hasn't borrowed any books.</p>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
